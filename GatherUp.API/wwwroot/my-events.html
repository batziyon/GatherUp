<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GatherUp – האירועים שלי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body   { font-family: 'Heebo', Arial, sans-serif; background: #f0f4f8; direction:rtl; }
        /* topbar */
        .topbar{position:sticky;top:0;z-index:200;background:#1a202c;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 28px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
        .topbar-brand{font-size:1.2rem;font-weight:700;color:#fff}.topbar-brand span{color:#63b3ed}
        .topbar-right{display:flex;align-items:center;gap:12px}
        .topbar-user{font-size:.85rem;opacity:.85}
        .btn-logout{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.82rem;font-family:'Heebo',Arial,sans-serif;transition:background .2s}
        .btn-logout:hover{background:rgba(255,255,255,.12)}
        .mainnav{background:#2d3748;display:flex;justify-content:center;gap:4px;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.07)}
        .mainnav a{color:#a0aec0;text-decoration:none;padding:14px 22px;font-size:.9rem;font-weight:500;border-bottom:3px solid transparent;transition:all .2s;display:inline-block}
        .mainnav a:hover{color:#fff;border-bottom-color:rgba(255,255,255,.3)}
        .mainnav a.active{color:#63b3ed;border-bottom-color:#63b3ed}
        /* content */
        main   { max-width: 900px; margin: 28px auto; padding: 0 20px; }
        h2     { color: #1a202c; margin-bottom: 18px; font-size:1.3rem; }
        .event-card { background: white; border-radius: 14px; padding: 22px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border:1px solid #e2e8f0; }
        .event-card h3 { color: #1a202c; margin-bottom: 6px; font-size:1rem; }
        .event-card p  { font-size: 0.84rem; color: #718096; margin-top: 4px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.73rem; font-weight:600; margin: 4px 4px 0 0; }
        .badge-blue   { background: #ebf8ff; color: #2b6cb0; }
        .badge-green  { background: #f0fff4; color: #276749; }
        .badge-orange { background: #fffaf0; color: #c05621; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        button { padding: 7px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.84rem; font-family:'Heebo',Arial,sans-serif; font-weight:500; transition:all .18s; }
        .btn-blue  { background: #4299e1; color: white; }.btn-blue:hover{background:#3182ce}
        .btn-green { background: #48bb78; color: white; }.btn-green:hover{background:#38a169}
        .btn-red   { background: #fc8181; color: white; }.btn-red:hover{background:#e53e3e}
        .detail-panel { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-top: 14px; display: none; }
        .detail-panel.open { display: block; }
        .detail-panel h4 { color: #2d3748; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .detail-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 0.88rem; }
        .detail-row strong { min-width: 150px; color: #718096; font-weight:500; }
        .error-box { background: #fff5f5; color: #c53030; padding: 12px; border-radius: 8px; }
        .empty-msg { color: #a0aec0; text-align: center; padding: 40px; }
        .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; background:#e2e8f0; border-radius:10px; padding:4px; width:fit-content; }
        .tab { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.88rem; background: transparent; color:#4a5568; font-family:'Heebo',Arial,sans-serif; font-weight:500; transition:all .2s; }
        .tab.active { background: white; color:#2b6cb0; box-shadow:0 1px 4px rgba(0,0,0,.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="topbar">
      <div class="topbar-brand">Gather<span>Up</span> 🎉</div>
      <div class="topbar-right">
        <span class="topbar-user" id="header-user"></span>
        <button class="btn-logout" onclick="logout()">יציאה</button>
      </div>
    </div>
    <nav class="mainnav">
      <a href="index.html">לוח מכוונים</a>
      <a href="index.html" id="nav-create" style="display:none">יצירת אירוע</a>
      <a href="notification-preferences.html" class="active">פרופיל</a>
    </nav>
    <main>
        <h2>📋 האירועים שלי</h2>

        <div class="tab-bar">
            <button class="tab active" onclick="switchTab('participating', this)">🎫 אירועים שאני משתתף</button>
            <button class="tab" id="managed-tab" style="display:none" onclick="switchTab('managed', this)">👑 אירועים שאני מנהל</button>
        </div>

        <div id="tab-participating" class="tab-content active">
            <div id="participating-list"><div class="empty-msg">טוען...</div></div>
        </div>
        <div id="tab-managed" class="tab-content">
            <div id="managed-list"><div class="empty-msg">טוען...</div></div>
        </div>
    </main>

    <script>
        if (!sessionStorage.getItem('user')) window.location.replace('login.html');

        const user      = JSON.parse(sessionStorage.getItem('user'));
        const token     = user.token;
        const isManager = user.role === 'Manager';
        const myId      = user.id;
        const authHdr = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        document.getElementById('header-user').textContent = isManager ? `👑 ${user.name}` : `👤 ${user.name}`;
        if (isManager) {
            document.getElementById('managed-tab').style.display = 'inline-block';
            document.getElementById('nav-create').style.display  = 'inline-block';
        }

        function switchTab(name, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            btn.classList.add('active');
        }

        async function loadAll() {
            await loadParticipating();
            if (isManager) await loadManaged();
        }

        async function loadParticipating() {
            const container = document.getElementById('participating-list');
            try {
                const res = await fetch('/api/events/my/participating', { headers: authHdr });
                if (!res.ok) { container.innerHTML = '<div class="error-box">שגיאה בטעינת אירועים</div>'; return; }
                const events = await res.json();
                if (!events.length) { container.innerHTML = '<div class="empty-msg">אינך משתתף באירועים כרגע.</div>'; return; }
                container.innerHTML = events.map(e => renderEventCard(e, false)).join('');
            } catch { container.innerHTML = '<div class="error-box">שגיאת חיבור לשרת</div>'; }
        }

        async function loadManaged() {
            const container = document.getElementById('managed-list');
            try {
                const res = await fetch('/api/events/my/managed', { headers: authHdr });
                if (!res.ok) { container.innerHTML = '<div class="error-box">שגיאה בטעינת אירועים</div>'; return; }
                const events = await res.json();
                if (!events.length) { container.innerHTML = '<div class="empty-msg">אינך מנהל אירועים כרגע.</div>'; return; }
                container.innerHTML = events.map(e => renderEventCard(e, true)).join('');
            } catch { container.innerHTML = '<div class="error-box">שגיאת חיבור לשרת</div>'; }
        }

        function renderEventCard(e, isMine) {
            return `
            <div class="event-card">
                <h3>🎉 ${e.name}</h3>
                <p>📅 ${new Date(e.date).toLocaleDateString('he-IL')}
                   &nbsp;📍 ${e.location ?? 'טרם נקבע'}
                   &nbsp;💰 ${e.pricePerParticipant}₪</p>
                <span class="badge badge-blue">${e.participantIds.length} משתתפים</span>
                <span class="badge badge-green">${e.pollIds.length} סקרים</span>
                ${isMine ? '<span class="badge badge-orange">👑 האירוע שלי</span>' : ''}
                <div class="btn-row">
                    <button class="btn-blue" onclick="togglePanel(${e.id})">פרטים ▼</button>
                    ${!isMine ? `
                    <button class="btn-green" onclick="confirmAttendance(${e.id}, ${myId}, true)">✅ אני מגיע/ה</button>
                    <button class="btn-red"   onclick="confirmAttendance(${e.id}, ${myId}, false)">❌ לא מגיע/ה</button>` : ''}
                </div>
                <div class="detail-panel" id="panel-${e.id}">
                    <h4>📄 פרטי האירוע</h4>
                    <div class="detail-row"><strong>שם:</strong><span>${e.name}</span></div>
                    <div class="detail-row"><strong>תאריך:</strong><span>${new Date(e.date).toLocaleDateString('he-IL')}</span></div>
                    <div class="detail-row"><strong>מיקום:</strong><span>${e.location ?? 'טרם נקבע'}</span></div>
                    <div class="detail-row"><strong>מחיר למשתתף:</strong><span>${e.pricePerParticipant}₪</span></div>
                    <div class="section-label">📊 סקרים</div>
                    ${e.pollIds.length
                        ? e.pollIds.map(pid =>
                            `<button class="btn-blue" style="margin:2px" onclick="window.location.href='polls.html?pollId=${pid}'">סקר #${pid}</button>`
                          ).join('')
                        : '<p style="color:#888;font-size:0.85rem">אין סקרים לאירוע זה.</p>'}
                </div>
            </div>`;
        }

        function togglePanel(id) {
            const panel = document.getElementById(`panel-${id}`);
            panel.classList.toggle('open');
        }

        async function confirmAttendance(eventId, participantId, attending) {
            const preferences = attending ? [
                'EventChanges',
                'PollCreated',
                'AttendanceConfirmed',
                'PaymentReceived'
            ] : [];

            const res = await fetch(`/api/participants/${participantId}/attendance?eventId=${eventId}`, {
                method: 'PUT', headers: authHdr,
                body: JSON.stringify({
                    isAttending: attending,
                    selectedPreferences: preferences
                })
            });
            if (res.ok) {
                alert(attending ? '✅ אישרת הגעה!' : '❌ דיווחת שלא מגיע/ה');
                loadAll();
            } else {
                const data = await res.json().catch(() => ({}));
                alert(data.message || 'שגיאה בעדכון הגעה');
            }
        }

        function logout() { sessionStorage.removeItem('user'); window.location.replace('login.html'); }

        loadAll();
    </script>
</body>
</html>
