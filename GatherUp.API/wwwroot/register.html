<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GatherUp – הרשמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',Arial,sans-serif;background:linear-gradient(135deg,#1a202c 0%,#2d3748 50%,#276749 100%);
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;direction:rtl}
.register-wrapper{width:100%;max-width:420px}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand h1{font-size:2rem;font-weight:700;color:#fff;letter-spacing:-1px}
.login-brand h1 span{color:#63b3ed}
.login-brand p{color:#a0aec0;font-size:.9rem;margin-top:6px}
.card{background:#fff;border-radius:20px;padding:36px 40px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.card h2{font-size:1.25rem;font-weight:700;color:#1a202c;margin-bottom:24px;text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;color:#4a5568;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;
  font-size:.95rem;font-family:'Heebo',Arial,sans-serif;color:#2d3748;transition:border-color .2s}
.field input:focus{outline:none;border-color:#48bb78}
#msg{font-size:.85rem;text-align:center;min-height:20px;margin-bottom:14px;
  padding:8px;border-radius:8px;display:none}
#msg.show-err{display:block;background:#fff5f5;color:#c53030}
#msg.show-ok{display:block;background:#f0fff4;color:#276749}
.btn-register{width:100%;padding:13px;background:linear-gradient(135deg,#48bb78,#38a169);
  color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;
  font-family:'Heebo',Arial,sans-serif;cursor:pointer;transition:opacity .2s}
.btn-register:hover{opacity:.9}
.btn-register:disabled{opacity:.55;cursor:not-allowed}
.footer-link{text-align:center;margin-top:18px;font-size:.85rem;color:#718096}
.footer-link a{color:#4299e1;text-decoration:none;font-weight:500}
.footer-link a:hover{text-decoration:underline}
hr{border:none;border-top:1px solid #e2e8f0;margin:22px 0}
</style>
</head>
<body>
<div class="register-wrapper">
  <div class="login-brand">
    <h1>Gather<span>Up</span> 🎉</h1>
    <p>הצטרפות כמשתתף/ת חדש/ה</p>
  </div>
  <div class="card">
    <h2>יצירת חשבון</h2>
    <div class="field">
      <label>שם מלא</label>
      <input id="name" type="text" placeholder="ישראל ישראלי"/>
    </div>
    <div class="field">
      <label>כתובת מייל</label>
      <input id="email" type="email" placeholder="example@gmail.com"/>
    </div>
    <div class="field">
      <label>סיסמה (ת.ז. או קוד בחירתך)</label>
      <input id="password" type="password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') register()"/>
    </div>
    <div id="msg"></div>
    <button class="btn-register" id="btn" onclick="register()">הרשמה</button>
    <hr/>
    <div class="footer-link">יש לך חשבון? <a href="login.html">כניסה</a></div>
  </div>
</div>
<script>
  async function register() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg      = document.getElementById('msg');
    const btn      = document.getElementById('btn');
    msg.className  = ''; msg.textContent = '';

    if (!name || name.length < 2) { showErr('נא להזין שם מלא (לפחות 2 תווים)'); return; }
    if (!email || !email.includes('@')) { showErr('נא להזין כתובת מייל תקינה'); return; }
    if (!password || password.length < 4) { showErr('סיסמה חייבת להיות לפחות 4 תווים'); return; }

    btn.disabled = true; btn.textContent = 'נרשם...';
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      if (res.ok) {
        const data = await res.json();
        sessionStorage.setItem('user', JSON.stringify(data));
        msg.className = 'show-ok'; msg.textContent = '✅ נרשמת בהצלחה! מעביר...';
        setTimeout(() => window.location.replace('index.html'), 1000);
      } else {
        const data = await res.json().catch(() => ({}));
        showErr(data.message || (res.status === 400 ? 'המייל כבר קיים במערכת' : 'שגיאה בהרשמה'));
      }
    } catch { showErr('שגיאת חיבור – ודא שהשרת פועל'); }
    finally { btn.disabled = false; btn.textContent = 'הרשמה'; }
  }
  function showErr(t) { const el=document.getElementById('msg'); el.className='show-err'; el.textContent='🔴 '+t; }
</script>
</body>
</html>
